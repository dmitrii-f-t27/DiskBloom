# XcodeGen spec for the Mac App Store build. Regenerate with: xcodegen generate
name: DiskBloom
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  DiskBloom:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/DiskBloom-AppStore.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: DiskBloom
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # The Apple on-device assistant model exists only on macOS 26 and later.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
        # Decisions written in t27 (Specs/*.t27) arrive as generated C.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Generated/DiskBloom-Bridging.h
        OTHER_CFLAGS: "$(inherited) -ffp-contract=off -Wno-parentheses-equality"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-parentheses-equality"
schemes:
  DiskBloom:
    build:
      targets:
        DiskBloom: all
    archive:
      config: Release
    run:
      config: Debug
